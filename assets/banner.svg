<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061a1c"/><stop offset="1" stop-color="#12123a"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g filter="url(#b)" opacity=".5">
    <circle cx="200" cy="80" r="90" fill="#2dd4bf"><animate attributeName="cx" values="200;420;200" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="230" r="110" fill="#6366f1"><animate attributeName="cy" values="230;60;230" dur="11s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="none" stroke="url(#ac)" stroke-width="3" opacity=".55">
    <ellipse cx="150" cy="240" rx="46" ry="14"/><path d="M104 240v28c0 8 21 14 46 14s46-6 46-14v-28"/>
    <ellipse cx="1050" cy="60" rx="46" ry="14"/><path d="M1004 60v28c0 8 21 14 46 14s46-6 46-14V60"/>
    <path d="M200 252h120" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M880 72h120" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;32" dur="1.5s" repeatCount="indefinite"/></path>
  </g>
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="4s" repeatCount="indefinite"/>
      <text x="600" y="150" font-size="84" font-weight="800" fill="url(#ac)">sqldelta</text>
    </g>
    <text x="600" y="205" font-size="26" fill="#cbd5e1">Diff two SQLite databases: schema and data</text>
  </g>
  <rect x="450" y="234" width="300" height="4" rx="2" fill="url(#ac)"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></rect>
</svg>
